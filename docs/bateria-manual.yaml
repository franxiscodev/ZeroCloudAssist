# Batería del plan 02 (§6): 12 preguntas con la página del manual que las responde.
# Aprobada por Francisco el 2026-09-14 (paso 1.10), antes de medir. No se cambia sin volver a aprobarla.
#
# Cada página esperada se comprobó en el texto extraído del PDF (EN_ACS355_UM_E_A5.pdf), no de
# memoria. G3: acierto si alguna página esperada está entre las de los chunks del prompt (top-2).
# riesgo: true → la tarjeta de seguridad es obligatoria (G4). claves: lo que debe decir una
# respuesta correcta (rúbrica de §6).
# Reparto: 4 codigo · 3 sintoma · 2 seguridad · 2 parametro · 1 fuera.

