name: CI

# Sin filtros de paths: android-unit es un check obligatorio en main, y un check obligatorio que
# no corre deja bloqueados los PR de solo documentación.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  android-unit:
    runs-on: ubuntu-latest
    steps:
      # Sin submódulos: los tests unitarios de :app no compilan la parte nativa de :lib.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # Configurar :lib hace que AGP descargue el NDK que fija (ndkVersion), y el SDK del runner no
      # trae aceptada su licencia: sin esto, el build falla con LicenceNotAcceptedException.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - run: bash gradlew :app:testDebugUnitTest
        working-directory: android

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv no publica etiqueta mayor flotante (no hay v10, solo v10.x.y): versión completa.
      - uses: astral-sh/setup-uv@v10.1.0
      # Los tests "manual" necesitan el PDF y los modelos, que no están en el repo. -v deja cada
      # test con PASSED en el log.
      - run: uv run --locked pytest -v -m "not manual"
        working-directory: tools
