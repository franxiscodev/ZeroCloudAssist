[project]
name = "zca-tools"
version = "0.1.0"
description = "Índice del manual del ACS355 para ZeroCloudAssist: extraer, trocear, vectorizar y evaluar"
requires-python = ">=3.11"
dependencies = [
    "pypdf",
    "numpy",
    "pyyaml",
    "tokenizers",
    "huggingface_hub",
    "requests",
]

[project.scripts]
zca-indice = "zca_tools.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zca_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "manual: necesita el PDF, los modelos o llama-server en el PC; se salta en la CI",
]
